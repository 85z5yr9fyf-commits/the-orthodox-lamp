<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study — Flashcards &amp; Quiz (rough draft) — The Orthodox Lamp</title>
<style>
:root{--gold:#c9a84c;--gl:#e8c96a;--bg:#0d0d0d;--bg2:#141414;--bg3:#1a1a1a;--br:#2a2a2a;--tx:#e8e0d0;--mu:#b8ac82;--red:#8b2020;--grn:#2e6b3a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,serif;line-height:1.6;padding:2rem 1rem;max-width:760px;margin:0 auto}
h1{color:var(--gl);font-size:1.6rem;text-align:center;letter-spacing:.05em}
.note{background:#2a1e00;border:1px solid var(--gold);color:var(--mu);font-size:.8rem;padding:.6rem .9rem;border-radius:6px;margin:1rem 0;text-align:center}
.tabs{display:flex;gap:.5rem;justify-content:center;margin:1.5rem 0}
.tabs button{background:var(--bg3);color:var(--mu);border:1px solid var(--br);padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.9rem}
.tabs button.on{background:var(--gold);color:#0d0d0d;font-weight:700;border-color:var(--gold)}
.panel{display:none}.panel.on{display:block}
/* flashcards */
.card{background:var(--bg2);border:1px solid var(--br);border-radius:10px;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;cursor:pointer;font-size:1.15rem;position:relative}
.card .side{max-width:560px}
.card .q{color:var(--gl)}.card .a{color:var(--tx);font-size:1rem}
.card .hint{position:absolute;bottom:.6rem;left:0;right:0;font-size:.7rem;color:var(--mu);letter-spacing:.1em;text-transform:uppercase}
.cardnav{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.cardnav button{background:var(--bg3);color:var(--gold);border:1px solid var(--br);padding:.5rem 1rem;border-radius:6px;cursor:pointer;font-family:inherit}
.count{color:var(--mu);font-size:.85rem}
/* quiz */
.q-block{background:var(--bg2);border:1px solid var(--br);border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1rem}
.q-block .qt{color:var(--gl);margin-bottom:.7rem;font-size:1rem}
.opt{display:block;width:100%;text-align:left;background:var(--bg3);color:var(--tx);border:1px solid var(--br);padding:.55rem .8rem;border-radius:6px;margin:.35rem 0;cursor:pointer;font-family:inherit;font-size:.9rem}
.opt.correct{background:var(--grn);border-color:#4c9a5e;color:#fff}
.opt.wrong{background:var(--red);border-color:#b33;color:#fff}
.opt:disabled{cursor:default}
.expl{font-size:.82rem;color:var(--mu);margin-top:.5rem;display:none}
.score{text-align:center;color:var(--gl);font-size:1.1rem;margin:1rem 0}
a.back{color:var(--gold);font-size:.85rem;display:block;text-align:center;margin-top:2rem}
/* OL-FABALIGN */
#ol-top,#ol-tt{right:22px;width:44px;height:44px}
.ol-ask-fab{right:22px;bottom:24px}
#ol-tt{bottom:90px}
#ol-top{bottom:148px}
@media(max-width:480px){.ol-ask-fab{right:14px;bottom:16px}#ol-tt{right:14px;bottom:82px;width:42px;height:42px}#ol-top{right:14px;bottom:138px;width:42px;height:42px}}
/* END-OL-FABALIGN */
</style>
<style>html.light{--gold:#8a6a20;--gl:#6f5413;--gd:#b08e3e;--bg:#f7f2e6;--bg2:#efe8d5;--bg3:#e7ddc7;--bg4:#ddd2b9;--bg5:#efe0b8;--tx:#2b2415;--mu:#6e6450;--br:#d2c7aa;--rc:#ead1d1;--rcc:#762323;--oo:#d5e7d5;--ooc:#2d6c2d;--pr:#d6e2ee;--prc:#1d4a6b}</style>
<script>try{if(localStorage.getItem('ol-theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<style id="ol-auth">
/* AUTO-AUTHENTIC-CSS: book typography (EB Garamond, self-hosted, SIL OFL) and quieter ornament */

@font-face{font-family:'EB Garamond';font-style:normal;font-display:swap;font-weight:400 800;src:url(fonts/eb-garamond-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'EB Garamond';font-style:italic;font-display:swap;font-weight:400 800;src:url(fonts/eb-garamond-greek-ext-wght-italic.woff2) format('woff2');unicode-range:U+1F00-1FFF}
@font-face{font-family:'EB Garamond';font-style:italic;font-display:swap;font-weight:400 800;src:url(fonts/eb-garamond-greek-wght-italic.woff2) format('woff2');unicode-range:U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF}
@font-face{font-family:'EB Garamond';font-style:italic;font-display:swap;font-weight:400 800;src:url(fonts/eb-garamond-latin-ext-wght-italic.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'EB Garamond';font-style:italic;font-display:swap;font-weight:400 800;src:url(fonts/eb-garamond-latin-wght-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html{font-size-adjust:.47}
body,body *:not(svg):not(svg *):not(code):not(pre):not(kbd){font-family:'EB Garamond',Georgia,'Times New Roman',serif!important;font-size-adjust:.47!important}
body{font-variant-numeric:oldstyle-nums;text-rendering:optimizeLegibility;font-kerning:normal}
h1,h2,h3,h4,table,.tl-date,.htl-cd,.yr,.ol-readtime,.sec-num{font-variant-numeric:lining-nums}
/* tracked capitals become small capitals */
.ol-sc{text-transform:none!important;font-variant-caps:all-small-caps;letter-spacing:.05em!important}
/* plainer boxes: small radii, no drop shadows or lifting cards */
.sec,.fc,.fi,.obj,.gt,.sv,.nx,.note,.badge,.tag,.council,.saint,.pos,.stage,.pillar,.lk,.ol-related,.ol-search-btn,.ol-print-btn,.oo-pgband,.rm-bar,.htl-card,.htl-detail,.lp-jump,.path-link,.ev-card,[class*="-card"],[class*="-box"],.obj-tag,.lx,.gk,.typ,.sac,.gift,.ic,.pat,.pf,.hist,.trad-col,.par-col,.q-block,.section,.intro-banner{border-radius:3px!important}
.oo-pgband,.mob-toggle,.htl-card,.step-n,.section,.sv,.fc{box-shadow:none!important}
[class*="-card"]:hover,[class*="-box"]:hover,.vbox:hover,.sec:hover,.obj:hover,.fi:hover{box-shadow:none!important;transform:none!important}
.site-title{text-shadow:none!important}
/* reading time as a quiet line, not a pill */
.ol-readtime{text-transform:none!important;border:0!important;background:none!important;padding:0!important;border-radius:0!important;font-style:italic;font-size:.86rem!important;font-variant-caps:normal!important;letter-spacing:0!important}
.ol-readtime::before{display:none!important}
/* opening paragraph: no coloured side bar */
.pg-intro{border-left:0!important;padding-left:0!important;font-size:1.06em}
/* the ✦ ✦ ✦ ornament becomes a simple rule */
.orn{letter-spacing:0!important;opacity:1!important}
.orn::before{content:"";display:block;width:84px;height:1px;margin:2px auto 0;background:currentColor;opacity:.55}
/* light mode: darker ink for gold text, and red rubrics as in a service book */
html.light{--gd:#7a5c17}
html.light .sec-num,html.light p.ol-lead::first-letter,html.light .purpose p:first-of-type::first-letter{color:#8e2a1e!important}
html.light .oo-pgband .cap,html.light .oo-pgband .cap b,html.light .oo-pgband::after{color:#f4e6c2!important}
html.light #ol-tt{background:var(--bg2);color:var(--gold);box-shadow:none}
html.light .ol-ask-fab,html.light .ol-ask-msg.user,html.light .ol-ask-foot button.send{background:#b8923f!important}

</style>
</head>
<body>
<h1>Study — Flashcards &amp; Quiz</h1>
<div class="note">Rough working draft — a sketch of the study feature, not final. Content is a small sample deck.</div>

<div class="tabs">
  <button id="tb-cards" class="on" onclick="tab('cards')">Flashcards</button>
  <button id="tb-quiz" onclick="tab('quiz')">Quiz</button>
</div>

<div id="cards" class="panel on">
  <div class="card" id="card" onclick="flip()">
    <div class="side" id="cardside"></div>
    <div class="hint">click to flip</div>
  </div>
  <div class="cardnav">
    <button onclick="prev()">‹ Prev</button>
    <span class="count" id="ccount"></span>
    <button onclick="next()">Next ›</button>
  </div>
</div>

<div id="quiz" class="panel">
  <div id="quizbody"></div>
  <div class="score" id="score"></div>
</div>

<a class="back" href="index.html">← Back to The Orthodox Lamp</a>

<script>
// --- sample flashcard deck (rough) ---
var deck=[
 {q:"On what day did the earliest Church gather to break bread?",a:"The Lord's Day (Sunday), the day of the Resurrection — see Acts 20:7, 1 Cor 16:2, Rev 1:10."},
 {q:"What does Colossians 2:16-17 call the Sabbath?",a:"A 'shadow of the things to come' — the substance belongs to Christ."},
 {q:"Which c.90-110 text calls the Eucharist a 'pure sacrifice' and cites Malachi 1:11?",a:"The Didache, chapter 14."},
 {q:"How is the Eucharistic sacrifice reconciled with Hebrews' 'once for all'?",a:"It does not repeat Calvary but re-presents the one eternal sacrifice — the Lamb 'slain' yet standing (Rev 5:6)."},
 {q:"What did Irenaeus (AH IV.18) say the consecrated bread is?",a:"'No longer common bread, but the Eucharist, consisting of two realities, earthly and heavenly.'"},
 {q:"Whose 'pure offering... in every place' do Justin and the Didache apply to the Eucharist?",a:"The prophecy of Malachi 1:11."},
 {q:"What is the 'argument from silence' fallacy?",a:"Assuming that because Scripture does not explicitly command a practice, the practice is therefore forbidden."},
 {q:"Vincent of Lerins' test for authentic Tradition?",a:"'Quod ubique, quod semper, quod ab omnibus' — what is believed everywhere, always, and by all."}
];
var i=0, showBack=false;
function renderCard(){var c=deck[i];document.getElementById('cardside').innerHTML= showBack ? '<div class="a">'+c.a+'</div>' : '<div class="q">'+c.q+'</div>';document.getElementById('ccount').textContent=(i+1)+' / '+deck.length;}
function flip(){showBack=!showBack;renderCard();}
function next(){i=(i+1)%deck.length;showBack=false;renderCard();}
function prev(){i=(i-1+deck.length)%deck.length;showBack=false;renderCard();}
renderCard();

// --- sample quiz (rough) ---
var quiz=[
 {q:"Which verse names 'the Lord's day'?",opts:["Acts 20:7","Revelation 1:10","Genesis 2:3"],ans:1,ex:"Rev 1:10 — 'I was in the Spirit on the Lord's day.'"},
 {q:"Constantine's 321 Sunday edict...",opts:["invented Christian Sunday worship","recognized an existing practice","abolished the Sabbath"],ans:1,ex:"Sunday worship is attested by the Didache, Ignatius and Justin — long before 321."},
 {q:"Ignatius (c.107) speaks of the Church having...",opts:["one altar","many altars","no altar"],ans:0,ex:"Philadelphians 4: 'one altar; as there is one bishop.'"},
 {q:"'Do this in remembrance' uses the Greek word...",opts:["agape","anamnesis","kenosis"],ans:1,ex:"Anamnesis — a liturgical making-present, used of temple memorial offerings."}
];
function renderQuiz(){var h='';quiz.forEach(function(q,qi){h+='<div class="q-block"><div class="qt">'+(qi+1)+'. '+q.q+'</div>';q.opts.forEach(function(o,oi){h+='<button class="opt" onclick="pick('+qi+','+oi+')" id="q'+qi+'o'+oi+'">'+o+'</button>';});h+='<div class="expl" id="ex'+qi+'">'+q.ex+'</div></div>';});document.getElementById('quizbody').innerHTML=h;}
var answered={};
function pick(qi,oi){if(answered[qi]!==undefined)return;answered[qi]=oi;var q=quiz[qi];for(var k=0;k<q.opts.length;k++){var b=document.getElementById('q'+qi+'o'+k);b.disabled=true;if(k===q.ans)b.classList.add('correct');}if(oi!==q.ans)document.getElementById('q'+qi+'o'+oi).classList.add('wrong');document.getElementById('ex'+qi).style.display='block';updateScore();}
function updateScore(){var n=0,tot=quiz.length;for(var k in answered)if(answered[k]===quiz[k].ans)n++;if(Object.keys(answered).length===tot)document.getElementById('score').textContent='Score: '+n+' / '+tot;}
renderQuiz();

function tab(name){['cards','quiz'].forEach(function(t){document.getElementById(t).classList.toggle('on',t===name);document.getElementById('tb-'+t).classList.toggle('on',t===name);});}
</script>
<button id="ol-tt" onclick="olTheme()" aria-label="Toggle light or dark mode" title="Light/dark mode">☀</button><script>function olTheme(){var l=document.documentElement.classList.toggle('light');try{localStorage.setItem('ol-theme',l?'light':'dark')}catch(e){}olIcon()}function olIcon(){document.getElementById('ol-tt').textContent=document.documentElement.classList.contains('light')?'☾':'☀'}olIcon();</script>
<script id="ol-lightfix">
/* AUTO-LIGHTFIX-JS: quiet typographic clean-up plus a light-mode safety net.
   In light mode it finds any box still painted with a dark-theme colour, or text
   too faint to read, and re-tints it (keeping its hue) so every page reads well. */
(function(){
  try{
    var R=document.documentElement;
    function P(c){var m=c&&c.match(/rgba?\(([^)]+)\)/);if(!m)return null;var a=m[1].split(/[ ,\/]+/).filter(Boolean).map(Number);return {r:a[0],g:a[1],b:a[2],a:a.length>3?a[3]:1};}
    function L(c){function f(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);}return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b);}
    function hsl(c){var r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;
      if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}return [h,s,l];}
    function css(h,s,l){return 'hsl('+Math.round(h*360)+','+Math.round(s*100)+'%,'+Math.round(l*100)+'%)';}
    function bgOf(el){for(var e=el;e&&e.nodeType===1;e=e.parentElement){var cs=getComputedStyle(e),c=P(cs.backgroundColor);if(c&&c.a>.5)return c;}return {r:247,g:242,b:230,a:1};}
    var SKIP='.oo-pgband,.ol-ask-fab,#ol-tt,.ol-ask-wrap .send,svg,img,video,canvas,code,pre';
    var done=[];
    function undo(){for(var i=done.length-1;i>=0;i--){var d=done[i];if(d[2])d[0].style.setProperty(d[1],d[2],d[3]);else d[0].style.removeProperty(d[1]);}done=[];}
    function set(el,p,v){done.push([el,p,el.style.getPropertyValue(p),el.style.getPropertyPriority(p)]);el.style.setProperty(p,v,'important');}
    function fix(){
      undo();
      if(!R.classList.contains('light'))return;
      var all=document.body.querySelectorAll('*');
      for(var i=0;i<all.length;i++){var el=all[i];if(el.closest(SKIP))continue;
        var cs=getComputedStyle(el),c=P(cs.backgroundColor);
        if(c&&c.a>.5&&L(c)<.16){var h=hsl(c);set(el,'background-color',css(h[0],Math.min(h[1],.32),.92));}
        var bi=cs.backgroundImage;
        if(bi&&bi.indexOf('gradient')>=0&&bi.indexOf('url(')<0){var m=bi.match(/rgba?\([^)]+\)/);var g=m&&P(m[0]);if(g&&g.a>.5&&L(g)<.16){set(el,'background-image','none');var hg=hsl(g);set(el,'background-color',css(hg[0],Math.min(hg[1],.3),.91));}}
      }
      for(var j=0;j<all.length;j++){var t=all[j];if(t.closest(SKIP))continue;
        var own=false;for(var k=0;k<t.childNodes.length;k++){var n=t.childNodes[k];if(n.nodeType===3&&n.textContent.trim()){own=true;break;}}
        if(!own)continue;
        var fg=P(getComputedStyle(t).color);if(!fg)continue;var bg=bgOf(t),a=L(fg),b=L(bg);
        var cr=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);
        if(cr<4.2&&b>.4){var hf=hsl(fg);set(t,'color',css(hf[0],Math.min(hf[1],.6),hf[1]>.15?.27:.24));}
      }
    }
    /* uppercase, widely tracked labels read as small capitals, as in a printed book */
    function caps(){var all=document.body.querySelectorAll('*');for(var i=0;i<all.length;i++){var el=all[i];if(el.closest('.oo-pgband,.ol-ask-wrap,#ol-tt'))continue;var cs=getComputedStyle(el);
      if(!el.classList.contains('ol-sc')&&parseFloat(cs.fontSize)<18&&cs.textTransform==='uppercase'&&parseFloat(cs.letterSpacing)>=0.6&&el.textContent.trim()){var px=parseFloat(cs.fontSize);el.classList.add('ol-sc');if(px)el.style.fontSize=Math.round(px*1.3*10)/10+'px';}}}
    function run(){try{caps();}catch(e){}try{fix();}catch(e){}}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
    window.addEventListener('load',function(){setTimeout(function(){try{caps();fix();}catch(e){}},400);setTimeout(function(){try{caps();fix();}catch(e){}},1600);});
    new MutationObserver(function(){try{fix();}catch(e){}}).observe(R,{attributes:true,attributeFilter:['class']});
    var tm=null;new MutationObserver(function(ms){if(!R.classList.contains('light'))return;for(var i=0;i<ms.length;i++){if(ms[i].addedNodes.length){clearTimeout(tm);tm=setTimeout(function(){try{caps();fix();}catch(e){}},250);return;}}}).observe(document.body,{childList:true,subtree:true});
    window.olLightFix=fix;
  }catch(e){}
})();

</script>
</body>
</html>
