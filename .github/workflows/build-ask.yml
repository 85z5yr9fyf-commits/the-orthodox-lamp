name: Rebuild Ask the Lamp index
on:
  push:
    branches: [main]
    paths: ['**.html']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install beautifulsoup4
      - run: python3 build_ask_content.py
      - run: |
          if ! git diff --quiet ask-content.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
            git add ask-content.json
            git commit -m "Rebuild ask-content.json"
            git push
          fi
